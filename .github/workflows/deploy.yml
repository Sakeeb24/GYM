name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Web for GitHub Pages
        env:
          PROD_SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://qwnxbdqzmxyukrbeqrcj.supabase.co' }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$PROD_SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY or SUPABASE_PUBLISHABLE_KEY secret/variable is missing in repository settings."
            exit 1
          fi
          flutter build web --release --base-href "/GYM/" \
            --dart-define=ENV=production \
            --dart-define=SUPABASE_URL="$PROD_SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$PROD_SUPABASE_ANON_KEY" \
            --dart-define=APP_NAME=LiftFlow

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
