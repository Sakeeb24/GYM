name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Web for GitHub Pages
        run: |
          flutter build web --release --base-href "/GYM/" \
            --dart-define=ENV=production \
            --dart-define=SUPABASE_URL=https://qwnxbdqzmxyukrbeqrcj.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3bnhiZHF6bXh5dWtyYmVxcmNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMDI2MDUsImV4cCI6MjA1Njc3ODYwNX0.uF40k_4D1F-1X0K8E8b4I_tH5vX5d8x4jL1d8b9z8vA \
            --dart-define=APP_NAME=LiftFlow

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
